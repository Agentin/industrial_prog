version: '3.8'

services:
  tasks_1:
    build:
      context: ../../
      dockerfile: services/tasks/Dockerfile
    container_name: tasks_1
    environment:
      TASKS_PORT: 8082
      INSTANCE_ID: tasks-1
      AUTH_GRPC_ADDR: auth:50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tasksdb
      REDIS_ADDR: redis:6379
    networks:
      - lb-net
    restart: unless-stopped

  tasks_2:
    build:
      context: ../../
      dockerfile: services/tasks/Dockerfile
    container_name: tasks_2
    environment:
      TASKS_PORT: 8082
      INSTANCE_ID: tasks-2
      AUTH_GRPC_ADDR: auth:50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tasksdb
      REDIS_ADDR: redis:6379
    networks:
      - lb-net
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - tasks_1
      - tasks_2
    networks:
      - lb-net
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres_lb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasksdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lb-net

  redis:
    image: redis:7-alpine
    container_name: redis_lb
    networks:
      - lb-net

  auth:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    container_name: auth_lb
    environment:
      AUTH_PORT: 8081
      AUTH_GRPC_PORT: 50051
    networks:
      - lb-net

networks:
  lb-net:
    driver: bridge

volumes:
  postgres_data: